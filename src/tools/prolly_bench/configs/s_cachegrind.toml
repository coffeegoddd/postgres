# Instructions without hardware counters: the counter shape's work, reduced,
# with the server under Cachegrind (tens of times slower).  For the nightly
# on machines whose counters perf can't read; reported, not gated.

[run]
quality = "smoke"
repetitions = 1
clients = [1]
warmup_seconds = 0
measure_seconds = 1            # (unused: the work is fixed)
sizes = ["counters"]
workloads = ["S1", "S2", "S7"]
fio_baseline = false
seed = 1
settled_counters = true
cluster = "cachegrind"
collectors = ["wal", "engine_counters", "cachegrind"]
required_collectors = ["cachegrind"]

[postgres]
shared_buffers = "256MB"
autovacuum = "off"
checkpoint_timeout = "1d"
max_wal_size = "16GB"
wal_level = "minimal"
max_wal_senders = 0
fsync = "on"
synchronous_commit = "on"
full_page_writes = "on"
max_connections = 16

[sizes.counters]
pgbench_scale = 1
s4_rows = 10000
s7_rows = 5000
tpcc_warehouses = 1
tpch_scale = 0.01
v_rows = 1000
sysbench_tables = 1
sysbench_table_size = 1000

[workloads.S1]
transactions = 200

[workloads.S2]
transactions = 500

[workloads.S7]
transactions = 200
