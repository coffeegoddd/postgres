# Regressions of the S suite's gate a pull request accepts, one entry each:
#
#   [[accept]]
#   workload = "S1"            # S10/oltp_read_write for one variant
#   engine = "prolly"          # heap or prolly
#   counter = "wal_bytes"      # a counter, or a timing metric (throughput,
#                              # latency_p50_ms, latency_p99_ms)
#   reason = "the fold logs its root (fixes #210)"
#
# Only the entries a pull request's own diff adds count: entries already on
# its base accept nothing.  The file has a code owner, so an entry is
# reviewed by a maintainer.  Leave old entries here; they are history.

# #412: the change log writes an entry with each tuple version, so every
# write costs about one more WAL record (and its buffers) until #414's
# folds stop copying pages; accepted by the user, after a write's
# entries were batched and the versions made passed in hand.

[[accept]]
workload = "S1"
engine = "prolly"
counter = "io_extends"
reason = "a change log entry per write (#412): the design's cost, accepted by the user"

[[accept]]
workload = "S1"
engine = "prolly"
counter = "io_hits"
reason = "a change log entry per write (#412): the design's cost, accepted by the user"

