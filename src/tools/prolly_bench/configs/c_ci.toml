[run]
repetitions = 1
clients = [1]
warmup_seconds = 0
measure_seconds = 0
sizes = ["corpus"]
collectors = []
fio_baseline = false

[postgres]
shared_buffers = "256MB"
max_connections = 32
fsync = "off"
synchronous_commit = "off"
full_page_writes = "off"
autovacuum = "off"

[sizes.corpus]

[workloads.C1]
workers = 4

[workloads.C2]
workers = 4

[workloads.C3]
workers = 4
sample = "per_directory"

[workloads.C4]
workers = 4
sample = "per_directory"

[tools]
sqllogictest = "slt-corpus"
slt_runner = "build-bench/slt/slt-runner"
slt_source_hash_file = "build-bench/slt/SOURCE_HASH"
