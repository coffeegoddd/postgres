# Known exceptions to the V suite's growth-shape targets (vshape, V9): a
# check's counter that grows faster than its target today, the shape it
# has (current) and the issue that owns the work to meet the target.
#
# Each stays checked.  vshape fails when the counter grows faster than its
# current shape (a regression), when it grows slower but still misses the
# target (record the better shape here), and when it meets the target:
# then the change that met it removes the entry, and the check is enforced
# from then on.  An entry naming nothing the run checked fails too.

# A hard reset to the head gives each changed table the pages kept as of
# the head (new storage made of a snapshot) and drops the storage it had
# at commit, in the foreground: the map nodes and blocks its changes
# copied are freed then, each node's children counted down.
[[known]]
check = "hard_reset"
sweep = "rows"
counter = "bmap_refcount_updates"
current = "linear"
issue = "#768"
reason = "the swapped-out storage's copied nodes let go of at commit, a count down for each block under them"

[[known]]
check = "hard_reset"
sweep = "rows"
counter = "bmap_blocks_freed"
current = "log"
issue = "#768"
reason = "the swapped-out storage's own nodes and blocks freed at commit rather than in the background"

[[known]]
check = "hard_reset"
sweep = "delta"
counter = "bmap_blocks_freed"
current = "linear"
issue = "#768"
reason = "the blocks the dirty rows' pages were copied to, freed at commit rather than in the background"

# Deleting a branch drops its storage at commit: each block it shares is
# counted down, each it alone holds freed, all in the foreground.
[[known]]
check = "branch_delete"
sweep = "rows"
counter = "bmap_refcount_updates"
current = "linear"
issue = "#768"
reason = "a reference count down per shared block, at commit"

[[known]]
check = "branch_delete"
sweep = "delta"
counter = "bmap_blocks_freed"
current = "linear"
issue = "#768"
reason = "the branch's own blocks, those its changes copied, freed at commit rather than in the background"

# A historical point read decodes the commit's whole table (dolt_at is a
# full scan).
[[known]]
check = "point_read"
sweep = "rows"
counter = "nodes_read"
current = "linear"
issue = "#697"
reason = "dolt_at reads every row of the table at the commit; no key access path"
