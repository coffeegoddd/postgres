# Known exceptions to the V suite's growth-shape targets (vshape, V9): a
# check's counter that grows faster than its target today, the shape it
# has (current) and the issue that owns the work to meet the target.
#
# Each stays checked.  vshape fails when the counter grows faster than its
# current shape (a regression), when it grows slower but still misses the
# target (record the better shape here), and when it meets the target:
# then the change that met it removes the entry, and the check is enforced
# from then on.  An entry naming nothing the run checked fails too.

# A merge keeps its commit's pages (prolly.kept_commits): the snapshot's
# map work (the paths copied, their subtrees' holders) grows with the
# table today, as does the merge's own first writes into pages shared with
# the branch merged.
[[known]]
check = "merge"
sweep = "rows"
counter = "bmap_refcount_updates"
current = "linear"
issue = "#870"
reason = "a merge's kept snapshot and its copies of shared paths update holders in proportion to the table"

[[known]]
check = "merge"
sweep = "rows"
counter = "bmap_map_pages_copied"
current = "linear"
issue = "#870"
reason = "map pages a merge copies grow with the table"

[[known]]
check = "ff_merge"
sweep = "rows"
counter = "bmap_refcount_updates"
current = "linear"
issue = "#870"
reason = "as merge's"

# The count pages a merge reads: a page for the children of each map page
# its snapshot walks, and one for each page its copies look up.  Those
# follow the map pages it copies (the entry above): the Δ changed rows
# land in more leaves as the table grows, until there are more leaves than
# changes (from 64k rows, where the series is log).
[[known]]
check = "merge"
sweep = "rows"
counter = "bmap_refcount_reads"
current = "linear"
issue = "#870"
reason = "follows the map pages a merge copies, which grow with the table while it has fewer leaves than changed rows"

# As other branches are added: a first use made of the pages a branch
# keeps as of the head finds them through the materialization cache,
# which lists every branch and reads each one's kept commits from the
# refs; and making a branch refuses a name that differs from another's
# only by case by listing every branch's name.
[[known]]
check = "first_use"
sweep = "branches"
counter = "branches_listed"
current = "linear"
issue = "#1016"
reason = "the materialization cache's visit lists every branch to find the kept commits"

[[known]]
check = "first_use"
sweep = "branches"
counter = "refs_nodes_read"
current = "linear"
issue = "#1016"
reason = "and reads each branch's kept commits from the refs"

[[known]]
check = "create_branch"
sweep = "branches"
counter = "branches_listed"
current = "linear"
issue = "#1016"
reason = "a new name is checked against every branch's, case folded"

[[known]]
check = "create_branch"
sweep = "branches"
counter = "refs_nodes_read"
current = "linear"
issue = "#1016"
reason = "and the branches with only a head are read from the refs for it"

# A fast-forward merge moves main's working set to the merged head, and
# that move looks for other branches whose pages it can share: by listing
# every branch for a known fold, and through the materialization cache's
# visit, which lists them too and reads each one's kept commits.
[[known]]
check = "ff_merge"
sweep = "branches"
counter = "branches_listed"
current = "linear"
issue = "#1016"
reason = "a move's search for pages to share lists every branch, twice"

[[known]]
check = "ff_merge"
sweep = "branches"
counter = "refs_nodes_read"
current = "linear"
issue = "#1016"
reason = "and reads each branch's baseline and kept commits from the refs"
