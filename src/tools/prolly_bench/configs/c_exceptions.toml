# C suite records expected to differ from heap (B0), each with its reason.
# A listed record that differs is counted as "exception" instead of failing
# the gate; one that no longer differs is reported as stale.
#
# [[exception]]
# file = "index/orderby_nosort/10/slt_good_0.test"   # as slt-runner names it
# line = 1234                                        # the record's first SQL line
# am = "prolly"                                      # required; no wildcard
# reason = "..."
# owner = "..."
# issue = "https://..."
# expires = "YYYY-MM-DD"                            # future date
# class = "regression"                              # exact expected class
# baseline_hash = "..."                             # from diffs.jsonl.gz
# engine_hash = "..."                               # from diffs.jsonl.gz
# corpus_hash = "..."                               # file SHA-256 in corpus.json
# Changed signatures, expired exceptions and exceptions that now agree fail.
# Missing evidence, crashes, timeouts and unsupported work cannot be excepted.
