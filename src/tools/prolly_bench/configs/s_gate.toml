# The S suite gate's settings (prolly_bench sgate, scalibrate).
#
# PROVISIONAL: the starting points, not yet set from A/A runs on GitHub's
# hosted runners (.github/workflows/performance-calibration.yml measures
# them; prolly_bench scalibrate suggests values).  Until they are, the gate
# runs and comments but isn't a required check.

[gate]
# A counter regresses when it is more than this much above the base's ...
relative = 0.05
# ... and, in total over the run's fixed work, more than its floor above it.
floor_events = 8.0
floor_bytes = 8192.0
# Instructions: no floor beyond the tolerance, which two runs of one build
# may differ by (no hardware counters on hosted runners so far: unused there).
floor_instructions = 0.0
instructions_tolerance = 0.01
# A timing cell regresses when its 95% interval clears this (reported, not
# gated, on hosted runners) ...
timing_threshold = 0.05
# ... in every one of this many attempts.
attempts = 3
