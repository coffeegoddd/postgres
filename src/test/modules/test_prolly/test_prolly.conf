# Every working set taken from an earlier fold instead of folding is
# folded too, and checked against it (#482).
debug_prolly_verify_fold_caches = on
# Nor autovacuum: its workers' snapshots and locks land in the middle of
# tests, holding back the change logs' trimming (the entries a test
# counts) and a reset's sharing of another branch's pages (its locks, taken
# only if free), on a slow machine now and then.  A test that wants a
# vacuum runs one.
autovacuum = off
# Folds counted exactly, so none in the background (162_fold_worker.pl
# tests the fold worker).
prolly_fold_worker = off
