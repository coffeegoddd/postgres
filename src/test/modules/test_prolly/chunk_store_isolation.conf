# The history store's isolation tests: no background freer (as
# chunk_store.conf), and no autovacuum, whose VACUUM of the store would
# count others' bytes dead while a test counts its own
chunk_free_in_background = off
autovacuum = off
# (the history store's tier, its packs in a directory of the data directory)
history_tier_location = 'pg_test_history_tier'
