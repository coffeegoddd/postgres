# Server settings for running the requirements suite on heap, stock
# Postgres's table access method.  The suite's expected output is what heap
# gives, so a run on heap checks the tests themselves.
#
# prolly_test.table_am names the access method the tests are meant to run
# on; the target tests compare it with the one new tables really get, so a
# run whose settings were not applied fails instead of quietly testing
# something else.
default_table_access_method = 'heap'
prolly_test.table_am = 'heap'
