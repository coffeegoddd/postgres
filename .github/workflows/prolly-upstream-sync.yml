# Weekly merge of postgres/postgres master into the fork.
#
# src/tools/prolly/upstream_sync.sh makes the branch upstream-sync-<date>,
# merges, resolves the recurring catversion.h conflict, pushes and opens
# the pull request, which is merged as a merge commit like any other sync.
# A merge with other conflicts, or any other failure, files an issue
# instead (or comments on the open one), for a person to sync by hand with
# the same script.  A re-run while a sync is under way (its branch exists
# or an upstream-sync pull request is open) does nothing.
#
# Unless the repository allows Actions to create pull requests, or the
# PROLLY_SYNC_TOKEN secret is set, GitHub refuses the workflow's token the
# pull request; the merged branch is then pushed and tested, and an issue
# links the page to open the pull request by hand.
#
# Pull requests opened with the workflow's own token do not start other
# workflows, so unless the PROLLY_SYNC_TOKEN secret holds a token that may,
# the prolly workflow is started on the sync branch directly; its checks
# land on the branch's head commit, which is the pull request's.  The
# workflow's token also cannot push changes to workflow files, which an
# upstream merge can bring (pg-ci.yml); such a sync fails to push and files
# an issue unless PROLLY_SYNC_TOKEN has the workflow scope.

name: prolly upstream sync

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: prolly-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: merge postgres/master
    if: github.repository == 'coffeegoddd/postgres'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.PROLLY_SYNC_TOKEN || github.token }}
      HAS_SYNC_TOKEN: ${{ secrets.PROLLY_SYNC_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PROLLY_SYNC_TOKEN || github.token }}

      - name: Merge postgres/master
        id: sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          date=$(date -u +%Y-%m-%d)
          echo "branch=upstream-sync-$date" >> "$GITHUB_OUTPUT"
          set +e
          src/tools/prolly/upstream_sync.sh --push --date "$date" 2>&1 | tee sync.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # (the exit statuses are upstream_sync.sh's; the steps below act
          # on them)
          exit 0

      # (status 5: the merge is clean and pushed, but this token may not
      # open pull requests; the branch is tested all the same)
      - name: Run the prolly workflow on the sync branch
        if: (steps.sync.outputs.status == '0' && env.HAS_SYNC_TOKEN != 'true') || steps.sync.outputs.status == '5'
        run: gh workflow run prolly.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.sync.outputs.branch }}"

      # Status 3 (nothing to merge) and 4 (a sync already under way) need
      # nobody.
      - name: Report a sync that needs a person
        if: steps.sync.outputs.status != '0' && steps.sync.outputs.status != '3' && steps.sync.outputs.status != '4'
        env:
          STATUS: ${{ steps.sync.outputs.status }}
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$STATUS" = 5 ]; then
            title="Upstream sync pull request needs opening by hand"
            {
              echo "The weekly upstream sync ($run_url) merged postgres/master cleanly and pushed \`$BRANCH\`, but GitHub did not let the workflow's token open the pull request."
              echo
              echo "Open it here, and merge it as a merge commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/master...$BRANCH?expand=1"
              echo
              echo "The prolly workflow was started on the branch, so its checks are on the branch's head commit."
              echo
              echo "To let future syncs open their pull requests, either:"
              echo
              echo "- turn on **Allow GitHub Actions to create and approve pull requests** (Settings → Actions → General → Workflow permissions), or"
              echo "- add a \`PROLLY_SYNC_TOKEN\` repository secret holding a token with the \`repo\` and \`workflow\` scopes, which also lets a sync push upstream changes to workflow files and start the pull request's own checks."
            } > report.md
          else
            title="Upstream sync needs a manual merge"
            {
              echo "The weekly upstream sync ($run_url) could not finish on its own (exit status $STATUS):"
              echo
              echo '```'
              tail -n 60 sync.log
              echo '```'
              echo
              echo 'Run `src/tools/prolly/upstream_sync.sh` in a checkout, resolve the conflicts on the sync branch, push it and open its pull request; merge it as a merge commit.'
            } > report.md
          fi
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file report.md
          fi
          # (a sync that needs opening by hand is otherwise done)
          [ "$STATUS" = 5 ]
