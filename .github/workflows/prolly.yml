# CI for the prolly storage fork: every pull request (including stack layers) builds and
# runs the tests that must pass before it is merged.  (Upstream's pg-ci.yml
# is left as it is; it only runs when the PG_CI_ENABLED variable is set.)

name: prolly

on:
  pull_request:
    # the specs are documentation; changing only them builds nothing
    paths-ignore:
      - 'specs/**'
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: prolly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sanitizers:
    name: nightly address and undefined-behavior checks
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang bison flex \
            libicu-dev libipc-run-perl libreadline-dev libssl-dev zlib1g-dev
      - name: Build and exercise storage and durability
        run: |
          ./configure --enable-cassert --enable-tap-tests --enable-injection-points \
            CC=clang CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' \
            LDFLAGS='-fsanitize=address,undefined'
          make -s -j4
          make -s -j4 -C contrib
          make -C src/test/modules/test_prolly check
          make -C src/test/prolly check-target check-semantics check-isolation \
            check-tap-durability PROLLY_AM=prolly
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sanitizer-evidence
          path: |
            **/tmp_check/log/**
            **/regression.diffs

  controlled-performance:
    name: controlled host performance evidence
    if: github.event_name == 'workflow_dispatch' && vars.PROLLY_BENCHMARK_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, linux, prolly-benchmark]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Build attested release binaries
        run: |
          bash src/tools/prolly_bench/build_postgres.sh \
            --build-dir "$PWD/build-bench/controlled-${GITHUB_RUN_ID}" -- --with-openssl
      - name: Paired storage sweeps on the provisioned data device
        env:
          PBENCH_DATA_ROOT: ${{ vars.PROLLY_BENCHMARK_DATA_ROOT }}
        run: |
          test -n "$PBENCH_DATA_ROOT"
          src/tools/prolly_bench/prolly_bench run S --am heap,prolly \
            --workloads S1,S2 --clients 1 --quality benchmark \
            --pg-bin "$PWD/build-bench/controlled-${GITHUB_RUN_ID}/inst/bin" \
            --work-dir "$PBENCH_DATA_ROOT" --out "$PWD/engine-results/performance"
          src/tools/prolly_bench/prolly_bench table --results "$PWD/engine-results/performance"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: controlled-performance-evidence
          path: engine-results/performance/**

  # code that only an assertion-enabled build compiles in can leave a
  # release build broken
  release-build:
    name: build without assertions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex libicu-dev libreadline-dev libssl-dev zlib1g-dev rsync sysbench

      - name: Build
        run: |
          ./configure --prefix="$PWD/build-rel/inst" --enable-injection-points --with-openssl
          make -s -j4 COPT=-Werror
          make -s -j4 -C contrib COPT=-Werror
          make -s -j4 -C src/test/modules COPT=-Werror
          make -s install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Fetch pinned BenchBase source
        uses: actions/checkout@v5
        with:
          repository: dolthub/benchbase
          ref: a3a748326f4d1e615fd12db4a6ae59a60190a6ee
          path: benchbase-source

      - name: Build BenchBase
        run: bash src/tools/prolly_bench/build_benchbase.sh "$PWD/benchbase-source"

      - name: Release benchmark clients, collectors and invariants
        run: |
          src/tools/prolly_bench/prolly_bench run S --am heap,prolly \
            --workloads S1,S4,S9,S10,S13 --config src/tools/prolly_bench/configs/integration.toml \
            --work-dir "$RUNNER_TEMP/benchmark-smoke" --out "$PWD/engine-results/benchmark-smoke"
          src/tools/prolly_bench/prolly_bench table --results "$PWD/engine-results/benchmark-smoke"
          src/tools/prolly_bench/prolly_bench run V --am prolly \
            --workloads V1,V2 --config src/tools/prolly_bench/configs/integration.toml \
            --work-dir "$RUNNER_TEMP/v-smoke" --out "$PWD/engine-results/v-smoke"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-benchmark-evidence
          path: engine-results/**

  build-and-test:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex libicu-dev libipc-run-perl libreadline-dev libssl-dev zlib1g-dev

      - name: Build
        run: |
          ./configure --enable-cassert --enable-debug --enable-tap-tests --enable-injection-points --with-openssl
          make -s -j4
          make -s -j4 -C contrib

      - name: Postgres regression tests
        run: make check

      - name: Prolly interface conformance and recovery (test_prolly)
        run: make -C src/test/modules/test_prolly check

      - name: pg_waldump (prolly resource managers)
        run: make -C src/bin/pg_waldump check

      - name: Requirements suite, validated against heap
        run: make -C src/test/prolly check-heap

      - name: Requirements on versioned prolly storage
        run: |
          make -C src/test/prolly check-target check-semantics check-isolation \
            check-tap-durability check-vc check-vc-isolation check-tap-vc \
            check-vc-target check-vc-target-guard PROLLY_AM=prolly

      # The steps above run check's groups one by one; this catches a group
      # check names but can't make (a missing prerequisite stops it partway).
      - name: The requirements suite's check resolves
        run: make -n -C src/test/prolly check PROLLY_AM=prolly > /dev/null

      - name: Upstream suites on block-mapped storage (nightly)
        if: github.event_name == 'schedule'
        run: make -C src/test/prolly check-upstream-bmap

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/tools/prolly_bench/slt/go.mod
          cache-dependency-path: src/tools/prolly_bench/slt/go.sum

      - name: Runner tests and builds
        run: |
          (cd src/tools/prolly_bench/slt && go test ./...)
          bash src/tools/prolly_bench/build_diff.sh
          bash src/tools/prolly_bench/build_vc.sh
          bash src/tools/prolly_bench/build_slt.sh

      - name: Version-control scenario adapters
        run: |
          src/tools/prolly_bench/prolly_bench vc \
            --pg-bin "$PWD/tmp_install/usr/local/pgsql/bin" --am prolly \
            --self-test --out "$PWD/engine-results/vc-prolly"
          src/tools/prolly_bench/prolly_bench vc \
            --pg-bin "$PWD/tmp_install/usr/local/pgsql/bin" --am heap,prolly \
            --cases src/tools/prolly_bench/slt/internal/vcscenario/cases/sql-values.json \
            --out "$PWD/engine-results/vc-sql-adapters"

      - name: Fetch pinned Dolt test source
        uses: actions/checkout@v5
        with:
          repository: dolthub/dolt
          ref: 51cc4458b740ac132cb2302fe5394a2abbfba39d
          path: dolt-vc-source
          sparse-checkout: |
            go/libraries/doltcore/sqle/enginetest
            go/libraries/doltcore/merge
            go/libraries/doltcore/doltdb
            go/libraries/doltcore/ref
            go/store/prolly/tree
            go/store/datas

      - name: Fetch pinned Doltgres test source
        uses: actions/checkout@v5
        with:
          repository: dolthub/doltgresql
          ref: d5e05f46728e4a28116770eb683090c3ccd82ca4
          path: doltgres-vc-source
          sparse-checkout: testing/go

      - name: Verify Dolt source inventory and reviewed mappings
        working-directory: src/tools/prolly_bench/slt
        run: |
          go run ./cmd/dolt-catalog \
            --repo "$GITHUB_WORKSPACE/dolt-vc-source" \
            --revision 51cc4458b740ac132cb2302fe5394a2abbfba39d \
            --doltgres-repo "$GITHUB_WORKSPACE/doltgres-vc-source" \
            --doltgres-revision d5e05f46728e4a28116770eb683090c3ccd82ca4 \
            --check ../corpus/dolt/source-lock.json \
            --out "$GITHUB_WORKSPACE/engine-results/dolt-catalog"
          go run ./cmd/dolt-corpus --root ../corpus/dolt \
            --catalog "$GITHUB_WORKSPACE/engine-results/dolt-catalog/catalog.json" \
            --out "$GITHUB_WORKSPACE/engine-results/dolt-port-review.json" \
            --markdown "$GITHUB_WORKSPACE/engine-results/dolt-coverage.md"
          cat "$GITHUB_WORKSPACE/engine-results/dolt-coverage.md" >> "$GITHUB_STEP_SUMMARY"
          go build -o "$GITHUB_WORKSPACE/build-bench/vc/dolt-corpus" ./cmd/dolt-corpus

      - name: Imported Dolt scenarios
        run: |
          src/tools/prolly_bench/prolly_bench vc \
            --pg-bin "$PWD/tmp_install/usr/local/pgsql/bin" --am prolly \
            --cases src/tools/prolly_bench/corpus/dolt/scenarios \
            --out "$PWD/engine-results/dolt-prolly"
          build-bench/vc/dolt-corpus --root src/tools/prolly_bench/corpus/dolt \
            --catalog engine-results/dolt-catalog/catalog.json \
            --results engine-results/dolt-prolly/results/summary.json \
            --out engine-results/dolt-prolly-coverage.json

      - name: Verify explicit unsupported ledger for engines without version control
        run: |
          status=0
          src/tools/prolly_bench/prolly_bench vc \
            --pg-bin "$PWD/tmp_install/usr/local/pgsql/bin" \
            --am heap \
            --cases src/tools/prolly_bench/corpus/dolt/scenarios \
            --out "$PWD/engine-results/dolt-unsupported" || status=$?
          test "$status" -eq 1
          status=0
          build-bench/vc/dolt-corpus --root src/tools/prolly_bench/corpus/dolt \
            --catalog engine-results/dolt-catalog/catalog.json \
            --results engine-results/dolt-unsupported/results/summary.json \
            --out engine-results/dolt-unsupported-coverage.json || status=$?
          test "$status" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("engine-results/dolt-unsupported-coverage.json").read_text())
          engines = {e["engine"]: e for e in report["engines"]}
          assert set(engines) == {"heap"}
          planned = report["ported_cases"] + report["partial_cases"]
          assert planned > 0
          for engine in engines.values():
              assert engine["unsupported"] == planned, engine
              assert engine["passed"] == engine["failed"] == engine["not_run"] == engine["passed_mapped_assertions"] == 0, engine
          PY

      - name: Seeded differential histories
        env:
          NIGHTLY: ${{ github.event_name == 'schedule' }}
        run: |
          seeds=5
          steps=36
          seed=1
          if [ "$NIGHTLY" = true ]; then
            seeds=100
            steps=72
            seed="$GITHUB_RUN_NUMBER"
          fi
          failed=0
          for am in heap prolly; do
            src/tools/prolly_bench/prolly_bench differential \
              --pg-bin "$PWD/tmp_install/usr/local/pgsql/bin" --am "$am" \
              --seed "$seed" --seeds "$seeds" --steps "$steps" --self-test \
              --reduce 24 --out "$PWD/engine-results/differential-$am" || failed=1
          done
          exit "$failed"

      # (the pin is also what the heap baseline was generated at)
      - name: Read the SQLLogicTest corpus pin
        id: corpus
        run: echo "commit=$(cat src/tools/prolly_bench/configs/sqllogictest.commit)" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned SQLLogicTest corpus
        uses: actions/checkout@v5
        with:
          repository: dolthub/sqllogictest
          ref: ${{ steps.corpus.outputs.commit }}
          path: slt-corpus

      - name: SQLLogicTest smoke and strict heap comparison
        run: |
          src/tools/prolly_bench/prolly_bench run C --am heap,prolly \
            --config src/tools/prolly_bench/configs/c_ci.toml \
            --pg-bin "$PWD/tmp_install/usr/local/pgsql/bin" \
            --work-dir "$RUNNER_TEMP/c-suite" --out "$PWD/engine-results/c-suite"
          src/tools/prolly_bench/prolly_bench cgate \
            engine-results/c-suite/*-C-B0 engine-results/c-suite/*-C-prolly
          src/tools/prolly_bench/prolly_bench cbaseline check engine-results/c-suite/*-C-B0

      - name: Full pinned SQLLogicTest corpus (nightly)
        if: github.event_name == 'schedule'
        run: |
          src/tools/prolly_bench/prolly_bench run C --am heap,prolly \
            --config src/tools/prolly_bench/configs/c_full_ci.toml \
            --pg-bin "$PWD/tmp_install/usr/local/pgsql/bin" \
            --work-dir "$RUNNER_TEMP/c-full" --out "$PWD/engine-results/c-full"

      - name: Benchmark harness unit tests
        working-directory: src/tools/prolly_bench
        run: python3 -m unittest discover -s tests

      - name: Upload logs and coverage evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-logs
          path: |
            **/regression.diffs
            **/tmp_check/log/*
            **/output_iso/regression.diffs
            **/tmp_check/semantics/**
            **/tmp_check/isolation/**
            engine-results/**
          if-no-files-found: ignore
